<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="瑪奇手遊（마비노기 모바일）韓服 21 個職業的改版紀錄與 S2 職業強度：每次改版的增強、削弱與修正逐項附官方公告來源，並整理 Nightmare Drill 與團戰 DPS 排行。">
<style>
:root{
  --bg:#ffffff;--text:#1d1d1f;--muted:#6e6e73;--line:#d9d9de;--line-soft:#ececf0;--head:#f5f5f7;
  --link:#0b57d0;--skill:#1f3a68;
  --up:#1a7f37;--down:#c62828;--mixed:#b26a00;--fix:#6e6e73;
  --up-cell:#2e9e4f;--down-cell:#d64545;--mixed-cell:#e0a030;--fix-cell:#c7c7cc;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161618;--text:#e8e8ea;--muted:#9a9aa0;--line:#38383d;--line-soft:#2a2a2e;--head:#202023;
    --link:#7aa7ff;--skill:#c9d6f0;
    --up:#5fd07e;--down:#ff7b72;--mixed:#e8b04a;--fix:#9a9aa0;
    --up-cell:#3fae5f;--down-cell:#d9534f;--mixed-cell:#c98f26;--fix-cell:#4a4a50;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:56px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}

/* Top bar: title, meta line, search */
header.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;gap:6px 20px;align-items:baseline;flex-wrap:wrap}
header.top h1{margin:0;font-size:17px;font-weight:700}
.meta{color:var(--muted);font-size:13px}
.search{margin-left:auto;display:flex;gap:10px;align-items:center}
.search input{width:300px;max-width:60vw;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);font:inherit;font-size:14px}
.search input:focus{outline:2px solid var(--link);outline-offset:-1px}
.count{color:var(--muted);font-size:13px;white-space:nowrap}

/* Layout */
.layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:36px;max-width:1200px;margin:0 auto;padding:20px 20px 60px}
nav.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:14px}
nav.toc ul{list-style:none;margin:0;padding:0}
nav.toc li.group>span{display:block;margin-top:12px;padding:2px 0;color:var(--muted);font-size:12px}
nav.toc a{display:block;padding:2px 0 2px 10px;color:var(--text);border-left:2px solid transparent}
nav.toc a:hover{color:var(--link);text-decoration:none}
nav.toc a.active{border-left-color:var(--text);font-weight:700}
main{min-width:0}

/* Panels */
.panel{display:none}
.panel.shown{display:block}
main.filtering .panel.shown~.panel.shown{margin-top:32px;padding-top:16px;border-top:1px solid var(--line)}
.kicker{margin:0;color:var(--muted);font-size:13px}
main h2{font-size:22px;font-weight:700;margin:0 0 8px}
main h3.sub{font-size:15px;margin:22px 0 6px}
main h4{font-size:16px;margin:28px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line-soft)}
.panel p{margin:6px 0 12px}
main ul{padding-left:20px}

/* Season summaries: plain paragraphs with a small label */
ul.seasons{list-style:none;padding:0;margin:10px 0 4px}
ul.seasons li{margin:0 0 12px}
.s-head{display:flex;gap:8px;align-items:baseline}
.s-tag{font-weight:700}
.s-period{color:var(--muted);font-size:13px}

/* Community comments: footnote style */
.community-label{margin:16px 0 4px;font-size:13px;font-weight:700;color:var(--muted)}
ul.community{margin:0 0 20px;padding-left:18px;font-size:13.5px;color:var(--text)}
ul.community li{margin:3px 0}
.community-none{margin:0 0 20px;color:var(--muted);font-size:13.5px}

/* Names: no backgrounds, only weight and tone */
.sk{color:var(--skill);font-weight:500}
.rn{color:inherit}

/* Tables */
.table-wrap{overflow-x:auto;margin:10px 0 20px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
thead th{background:var(--head);font-weight:600;font-size:13px;white-space:nowrap;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
table.changes td:last-child{white-space:nowrap}
td.type{white-space:nowrap}
.badge{font-size:13px;font-weight:600}
.badge::before{display:inline-block;width:1.1em}
.t-up{color:var(--up)}.t-up::before{content:"▲"}
.t-down{color:var(--down)}.t-down::before{content:"▼"}
.t-mixed{color:var(--mixed)}.t-mixed::before{content:"◆"}
.t-note{color:var(--fix)}.t-note::before{content:"·"}
tr.hidden{display:none}
.empty{color:var(--muted);padding:20px 0}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);margin-top:40px;padding-top:10px}

/* Overview matrix: class x patch date */
.matrix-wrap{overflow-x:auto;margin:12px 0 8px;border:1px solid var(--line)}
table.matrix{width:auto;font-size:12px;border-collapse:collapse}
table.matrix th,table.matrix td{padding:0;border:1px solid var(--line-soft);text-align:center;vertical-align:middle}
table.matrix thead th{background:var(--head);font-weight:500;color:var(--muted)}
table.matrix thead tr.season th{font-weight:700;color:var(--text);padding:2px 0}
table.matrix thead tr.dates th{writing-mode:vertical-rl;padding:4px 0;height:62px;font-variant-numeric:tabular-nums}
table.matrix th.cls{position:sticky;left:0;z-index:1;background:var(--bg);text-align:left;white-space:nowrap;padding:2px 10px 2px 6px;font-weight:500;color:var(--text)}
table.matrix th.grp{background:var(--head);text-align:left;padding:2px 0;color:var(--muted);font-weight:500}
table.matrix th.grp span{position:sticky;left:6px;padding:0 6px}
table.matrix td{width:22px;min-width:22px;height:22px}
table.matrix td a{display:block;width:100%;height:22px;line-height:22px;color:#fff;font-size:11px;text-decoration:none}
table.matrix td.s-start{border-left:2px solid var(--text)}
.c-up{background:var(--up-cell)}.c-down{background:var(--down-cell)}
.c-mixed{background:var(--mixed-cell)}.c-fix{background:var(--fix-cell)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);margin:6px 0 4px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}

/* S2 strength charts */
:root{--role-dealer:#2a78d6;--role-tank:#eb6834;--role-healer:#1baf7a;--grid:#e1e0d9}
@media (prefers-color-scheme:dark){:root{--role-dealer:#3987e5;--role-tank:#d95926;--role-healer:#199e70;--grid:#2c2c2a}}
details{margin:-12px 0 22px;font-size:14px}
details>summary{cursor:pointer;color:var(--link);font-size:13px;padding:4px 0}
details[open]>summary{margin-bottom:4px}
figure.chart{margin:14px 0 22px;padding:12px 14px;border:1px solid var(--line);overflow-x:auto}
figure.chart figcaption{font-size:14px;font-weight:600;margin-bottom:8px}
.chart-note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.chart-note.top{margin:-4px 0 8px;color:var(--text);font-size:13px}
.bar-group{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 2px;padding-bottom:2px;border-bottom:1px solid var(--line-soft)}
.bar-group:first-of-type{margin-top:4px}
.chart-legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.role-dealer{background:var(--role-dealer)}.role-tank{background:var(--role-tank)}.role-healer{background:var(--role-healer)}
/* bars, small multiples */
.sm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 28px}
.sm-title{font-size:13px;font-weight:600}.sm-note{font-size:12px;color:var(--muted);margin-bottom:4px}
.bar-row,.dot-row,.dot-axis{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:8px;font-size:12.5px;min-height:20px}
.bar-row .lbl,.dot-row .lbl{white-space:nowrap}
.bar-row .track{display:flex;align-items:center;gap:6px;min-width:0}
.bar-row .bar{display:block;height:10px;border-radius:0 4px 4px 0;min-width:2px}
.bar-row .val,.dot-row .val{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-row:hover,.dot-row:hover{background:var(--head)}
/* dot and range plots */
.dots.has-ext .dot-row,.dots.has-ext .dot-axis,.dot-head{grid-template-columns:96px minmax(0,1fr) 120px}
.dot-head{display:grid;gap:8px;font-size:12px;color:var(--muted);margin-bottom:2px}
.dots.has-ext .dot{background:var(--link)}
.dots.has-ext .dot-row .track,.dots.has-ext .dot-axis .track{margin-right:48px}
.dots.has-ext{padding-right:0}
.dots.has-ext .ext,.dot-head .ext{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.dots.has-ext .dot-row .ext{color:var(--text)}
.dots{padding-right:56px}
.dot-row .track,.dot-axis .track{position:relative;height:20px;border-left:1px solid var(--grid)}
.dot-row .track{background:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--gs) - 1px),var(--grid) calc(var(--gs) - 1px),var(--grid) var(--gs))}
.dot-row .dot{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--bg)}
.dot-row .rng{position:absolute;top:50%;height:3px;transform:translateY(-50%);opacity:.55}
.dot-row .val{position:absolute;top:50%;transform:translateY(-50%);margin-left:10px;font-size:12px}
.dot-axis .track{border-left:0;height:16px}
.dot-axis span span{position:absolute;transform:translateX(-50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:860px){.sm-grid{grid-template-columns:1fr}.dots.has-ext{min-width:520px}figure.chart{padding:10px 8px}
  .table-wrap table:not(.changes):not(.matrix){min-width:560px}.bar-row,.dot-row,.dot-axis{grid-template-columns:64px minmax(0,1fr)}}

@media (max-width:860px){
  header.top{position:static}
  .top-inner{padding:8px 14px}
  .search{margin-left:0;width:100%}
  .search input{width:100%;max-width:none}
  .layout{grid-template-columns:1fr;gap:10px;padding:0 14px 48px}
  nav.toc{position:sticky;top:0;z-index:9;max-height:none;margin:0 -14px;padding:6px 14px;background:var(--bg);
    border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  nav.toc::-webkit-scrollbar{display:none}
  nav.toc>ul,nav.toc ul ul{display:inline-flex;gap:14px;align-items:baseline}
  nav.toc li.group{display:inline-flex;gap:14px;align-items:baseline}
  nav.toc li.group>span{margin:0 0 0 6px}
  nav.toc a{padding:2px 0;border-left:0;border-bottom:2px solid transparent}
  nav.toc a.active{border-bottom-color:var(--text)}
  html{scroll-padding-top:48px}
  table.changes td:nth-child(3){min-width:200px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>{{TITLE}}</h1>
    <span class="meta">韓服 · 改版紀錄查核至 2026/10/13（43 份官方公告）· 強度資料 2026/10/14</span>
    <div class="search">
      <input id="q" type="search" placeholder="搜尋技能名（中／韓）、日期、類型" aria-label="搜尋全部職業的改動表格">
      <span class="count" id="count"></span>
    </div>
  </div>
</header>
<div class="layout">
  <nav class="toc" aria-label="分頁">{{NAV}}</nav>
  <main id="content">
{{BODY}}
    <p class="empty" id="empty" hidden>沒有符合的列。</p>
    <footer>資料來源：改版紀錄取自韓服 Nexon「瑪奇手遊（마비노기 모바일）」官方更新公告，查核截至 2026/10/13；S2 職業強度取自粉絲網站 모비라이프 與 모비스코어 2026/10/14 的資料。非官方整理，數值以遊戲內與官方公告為準；社群評論僅代表發文者看法。</footer>
  </main>
</div>
<script>
(function(){
  // Wrap tables so they scroll horizontally on narrow screens.
  document.querySelectorAll('main table').forEach(function(t){
    var w=document.createElement('div');w.className=t.classList.contains('matrix')?'matrix-wrap':'table-wrap';
    t.parentNode.insertBefore(w,t);w.appendChild(t);
  });
  var panels=[].slice.call(document.querySelectorAll('.panel'));
  var links=[].slice.call(document.querySelectorAll('nav.toc a'));
  var q=document.getElementById('q'),count=document.getElementById('count'),empty=document.getElementById('empty');
  var baseTitle=document.title,main=document.getElementById('content');
  var narrow=window.matchMedia('(max-width:860px)');

  // One panel is shown at a time, picked by the URL hash.
  function current(){
    var id=decodeURIComponent(location.hash.slice(1));
    return panels.filter(function(p){return p.id===id;})[0]||panels[0];
  }
  function showTab(){
    var cur=current();
    panels.forEach(function(p){p.classList.toggle('shown',p===cur);});
    links.forEach(function(a){
      var on=decodeURIComponent(a.hash.slice(1))===cur.id;
      a.classList.toggle('active',on);
      if(on&&narrow.matches){a.scrollIntoView({block:'nearest',inline:'center'});}
    });
    document.title=cur===panels[0]?baseTitle:(cur.dataset.title+'｜'+baseTitle);
    // Show the most recent patches first in the overview matrix.
    cur.querySelectorAll('.matrix-wrap').forEach(function(w){w.scrollLeft=w.scrollWidth;});
    empty.hidden=true;
  }

  // While filtering, search every change table and show panels with matching rows.
  function apply(){
    var term=q.value.trim().toLowerCase(),total=0;
    main.classList.toggle('filtering',!!term);
    if(!term){
      document.querySelectorAll('tr.hidden').forEach(function(r){r.classList.remove('hidden');});
      count.textContent='';showTab();return;
    }
    panels.forEach(function(p){
      var hits=0;
      p.querySelectorAll('table.changes tbody tr').forEach(function(r){
        var hit=r.textContent.toLowerCase().indexOf(term)!==-1;
        r.classList.toggle('hidden',!hit);if(hit)hits++;
      });
      p.classList.toggle('shown',hits>0);total+=hits;
    });
    links.forEach(function(a){a.classList.remove('active');});
    count.textContent='符合 '+total+' 列';
    empty.hidden=total>0;
  }

  // Picking a tab ends any active filter, even when the hash does not change.
  document.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="#"]');
    if(a&&q.value){q.value='';setTimeout(apply,0);}
  });
  window.addEventListener('hashchange',function(){
    showTab();
    var y=main.getBoundingClientRect().top+window.scrollY-(narrow.matches?48:60);
    if(window.scrollY>y){window.scrollTo(0,y);}
  });
  q.addEventListener('input',apply);
  showTab();
})();
</script>
</body>
</html>
